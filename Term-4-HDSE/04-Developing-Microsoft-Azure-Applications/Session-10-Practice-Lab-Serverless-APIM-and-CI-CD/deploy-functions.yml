# Lab 10 - Task 4: CI/CD for the Function App
# Save as .github/workflows/deploy-functions.yml in a repo whose root holds FeedbackFunctions.csproj.
# Variables -> AZURE_FUNCTIONAPP_NAME   Secrets -> AZURE_FUNCTIONAPP_PUBLISH_PROFILE
name: Build and deploy Feedback Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
