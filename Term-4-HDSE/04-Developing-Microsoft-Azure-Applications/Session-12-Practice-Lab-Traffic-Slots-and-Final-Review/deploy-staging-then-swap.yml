# Lab 12 - Task 3: pipeline = build -> deploy to staging -> smoke test -> swap
# Save as .github/workflows/deploy-staging-then-swap.yml (repo root holds SlotDemo.csproj).
# Secret AZURE_CREDENTIALS = JSON from:
#   az ad sp create-for-rbac --name gh-slotdemo --role contributor \
#     --scopes /subscriptions/<id>/resourceGroups/rg-lab12 --json-auth
# Variables: AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP
name: Staging then swap

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to the staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: ./publish

      - name: Smoke test staging
        run: |
          sleep 30
          curl --fail https://${{ vars.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/health

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging --target-slot production
