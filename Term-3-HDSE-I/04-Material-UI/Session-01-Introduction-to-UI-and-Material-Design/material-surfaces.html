<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Surfaces and Elevation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" />
  <style>
    body { font-family: Roboto, sans-serif; background: #fef7ff; color: #1d1b20; padding: 24px; }

    /* An 8dp spacing grid: every gap is a multiple of 8px */
    .row { display: flex; gap: 24px; flex-wrap: wrap; }

    .surface { width: 160px; height: 100px; border-radius: 12px; padding: 16px;
               background: #f7f2fa; }

    /* Elevation levels: higher = bigger, softer shadow = "closer" to the user */
    .level0 { box-shadow: none; }
    .level1 { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
    .level2 { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); }
    .level3 { box-shadow: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3); }

    /* Shape scale: small, medium, large, extra-large corners */
    .shape-sm { border-radius: 8px; }
    .shape-md { border-radius: 12px; }
    .shape-lg { border-radius: 16px; }
    .shape-xl { border-radius: 28px; }
  </style>
</head>
<body>
  <h1>Elevation</h1>
  <div class="row">
    <div class="surface level0">Level 0<br />flat page</div>
    <div class="surface level1">Level 1<br />card</div>
    <div class="surface level2">Level 2<br />raised card</div>
    <div class="surface level3">Level 3<br />dialog / menu</div>
  </div>

  <h1>Shape</h1>
  <div class="row">
    <div class="surface level1 shape-sm">8px<br />chips</div>
    <div class="surface level1 shape-md">12px<br />cards</div>
    <div class="surface level1 shape-lg">16px<br />FAB</div>
    <div class="surface level1 shape-xl">28px<br />dialogs</div>
  </div>
</body>
</html>
