<!-- templates/index.html - Jinja2 template used by app.py -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courses</title>
</head>
<body>
  <h1>Our Courses</h1>
  <ul>
    {% for course in courses %}
      <li>{{ course.name }} - {{ course.sessions }} sessions</li>
    {% endfor %}
  </ul>
  <a href="/contact">Contact us</a> | <a href="/api/courses">JSON API</a>
</body>
</html>
