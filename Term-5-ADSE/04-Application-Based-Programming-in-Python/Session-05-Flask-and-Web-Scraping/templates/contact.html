<!-- templates/contact.html - a simple form that POSTs back to /contact -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
</head>
<body>
  <h1>Contact Us</h1>
  <form method="post">
    <input type="text" name="visitor_name" placeholder="Your name" required>
    <button type="submit">Send</button>
  </form>
  {% if message %}
    <p><strong>{{ message }}</strong></p>
  {% endif %}
  <a href="/">Back to home</a>
</body>
</html>
