<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FixIt Services - Practice Lab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Part A: navbar -->
  <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="#">FixIt</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
        <!-- Dark mode button handled by jQuery -->
        <button id="themeBtn" class="btn btn-sm btn-light ms-md-3">Dark mode</button>
      </div>
    </div>
  </nav>

  <!-- Part B: services grid (1 / 2 / 3 columns) -->
  <main class="container my-5" id="services">
    <h1 class="h3 mb-4">Our Services</h1>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 service">
          <div class="card-body">
            <h2 class="h5 card-title">Plumbing</h2>
            <button class="btn btn-outline-primary btn-sm more-btn">Details</button>
            <p class="details mt-2">Leaks, taps and water tanks fixed the same day.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 service">
          <div class="card-body">
            <h2 class="h5 card-title">Electrical</h2>
            <button class="btn btn-outline-primary btn-sm more-btn">Details</button>
            <p class="details mt-2">Wiring, UPS installation and fan repair.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 service">
          <div class="card-body">
            <h2 class="h5 card-title">AC Service</h2>
            <button class="btn btn-outline-primary btn-sm more-btn">Details</button>
            <p class="details mt-2">Gas refill, cleaning and seasonal check-up.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Part C: simple contact box -->
  <section class="container mb-5" id="contact">
    <h2 class="h4">Contact us</h2>
    <input id="phone" class="form-control mb-2" placeholder="Your phone number">
    <button id="callBtn" class="btn btn-success">Request a call</button>
    <div id="feedback" class="mt-2"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
