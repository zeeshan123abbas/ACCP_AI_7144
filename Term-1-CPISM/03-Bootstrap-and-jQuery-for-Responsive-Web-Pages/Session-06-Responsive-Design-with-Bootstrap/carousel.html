<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Carousel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container my-4">
  <!-- data-bs-ride="carousel" starts sliding automatically -->
  <div id="gallery" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner rounded">
      <!-- The first slide must have "active" -->
      <div class="carousel-item active">
        <img src="https://picsum.photos/id/1015/1200/500" class="d-block w-100" alt="River valley">
        <!-- Caption hidden on phones, shown from md -->
        <div class="carousel-caption d-none d-md-block">
          <h5>Field Trips</h5>
          <p>Learning outside the classroom.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/1005/1200/500" class="d-block w-100" alt="Student portrait">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/0/1200/500" class="d-block w-100" alt="Laptop and notebook">
      </div>
    </div>

    <!-- Previous / Next arrows point to the carousel id -->
    <button class="carousel-control-prev" type="button" data-bs-target="#gallery" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#gallery" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
