<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Bootstrap Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container my-4" style="max-width: 720px;">
  <h1 class="h3 mb-3">Admission Form</h1>

  <!-- novalidate: we let Bootstrap show the messages instead of the browser pop-ups -->
  <form id="admission" class="row g-3" novalidate>

    <!-- Floating label: the label sits inside the box -->
    <div class="col-md-6">
      <div class="form-floating">
        <input type="text" class="form-control" id="fullName" placeholder="Full name" required>
        <label for="fullName">Full name</label>
        <div class="invalid-feedback">Please enter your name.</div>
      </div>
    </div>

    <!-- Input group: text added before the input -->
    <div class="col-md-6">
      <div class="input-group has-validation">
        <span class="input-group-text">@</span>
        <input type="email" class="form-control" id="email" placeholder="Email" required>
        <div class="invalid-feedback">Enter a valid email.</div>
      </div>
    </div>

    <div class="col-md-6">
      <label for="course" class="form-label">Course</label>
      <select id="course" class="form-select" required>
        <option value="">Choose...</option>
        <option>Web Development</option>
        <option>AI Fundamentals</option>
      </select>
      <div class="invalid-feedback">Select a course.</div>
    </div>

    <div class="col-md-6">
      <p class="form-label mb-1">Timing</p>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="timing" id="morning" checked>
        <label class="form-check-label" for="morning">Morning</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="timing" id="evening">
        <label class="form-check-label" for="evening">Evening</label>
      </div>
    </div>

    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="agree" required>
        <label class="form-check-label" for="agree">I agree to the rules</label>
        <div class="invalid-feedback">You must agree first.</div>
      </div>
    </div>

    <!-- d-grid = full width button on phones; d-md-block = normal width from md -->
    <div class="col-12 d-grid d-md-block">
      <button class="btn btn-primary px-5" type="submit">Submit</button>
    </div>
  </form>

  <script>
    // Bootstrap's validation pattern in plain JavaScript (no library needed)
    const form = document.getElementById("admission");
    form.addEventListener("submit", function (event) {
      if (!form.checkValidity()) {        // any required field empty or wrong?
        event.preventDefault();           // stop sending the form
      } else {
        event.preventDefault();           // demo only: do not reload the page
        alert("Form submitted. Thank you!");
      }
      form.classList.add("was-validated"); // Bootstrap now shows red/green borders
    });
  </script>
</body>
</html>
