<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery DOM Manipulation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container my-4">
  <h1 class="h3">To-do list</h1>

  <div class="input-group mb-3">
    <input id="taskInput" class="form-control" placeholder="New task">
    <button id="addBtn" class="btn btn-primary">Add to end</button>
    <button id="topBtn" class="btn btn-outline-primary">Add to top</button>
  </div>

  <ul id="tasks" class="list-group">
    <li class="list-group-item">Revise Bootstrap grid <button class="btn btn-sm btn-danger float-end del">x</button></li>
  </ul>

  <p class="mt-3">Total tasks: <span id="count">1</span></p>
  <img id="pic" src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Bootstrap logo" width="60">
  <button id="swapBtn" class="btn btn-sm btn-dark">Change image alt</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="my-plugin.js"></script> <!-- our plugin, after jQuery -->
  <script src="dom.js"></script>
</body>
</html>
